# مراقب حداثة النسخ الاحتياطية (D09). النشر: .github/workflows/deploy-backup-monitor.yml، أو من جهاز المالك (README.md).
name = "mi-backup-monitor"
main = "index.js"
compatibility_date = "2025-01-01"

[triggers]
crons = ["17 * * * *"]

[[r2_buckets]]
binding = "BACKUPS"
bucket_name = "mi-backups"

[vars]
ALERT_FROM = "Milestone Impact <alerts@sunkvalue.com>"
# أسرار اختيارية تُضبط في Cloudflare لا هنا (README.md): ALERT_TO وRESEND_API_KEY للبريد، وSLACK_BOT_TOKEN وSLACK_CHANNEL لسلاك
