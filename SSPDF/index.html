<!doctype html>
<html lang="ar" dir="rtl">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#0B272F" />
  <link rel="icon" href="/favicon.ico" sizes="any" />
  <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
  <link rel="apple-touch-icon" href="/apple-touch-icon.png" />

    <title>SSPDF — إطار قرار محفظة الخدمات</title>
    <link rel="manifest" href="/manifest.webmanifest" />
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
      .card { background: #FFFFFF; border: 1px solid #E7E0CF; border-radius: 16px; box-shadow: 0 1px 3px rgba(6,30,44,.05); }
      .inp { background: #fff; border: 1px solid #E7E0CF; color: #061E2C; }
      .inp:focus { border-color: #C8A45C; }
      .inp::placeholder { color: #A9A28E; }
      select.inp option { color: #061E2C; }

      @media print {
        body * { visibility: hidden; }
        #decision-print-area, #decision-print-area * { visibility: visible; }
        #decision-print-area { position: absolute; inset: 0; padding: 20px; }
        .print-hide { display: none !important; }
        .print-only { display: block !important; }
      }
    </style>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
    <script>
      if ("serviceWorker" in navigator) {
        window.addEventListener("load", () =>
          navigator.serviceWorker.register("/sw.js").catch(() => {})
        );
      }
    </script>
  </body>
</html>
