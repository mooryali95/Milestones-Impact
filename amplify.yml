version: 1
frontend:
  phases:
    preBuild:
      commands:
        - npm install
    build:
      commands:
        - npm run build
    postBuild:
      commands:
        # نسخ Home Landing Page كصفحة رئيسية
        - cp home/index.html build/index.html
        - cp -r home/assets build/assets
        # نقل React app إلى /matrix
        - mkdir -p build/matrix
        - cp build/static build/matrix/static 2>/dev/null || cp -r build/static build/matrix/static
        - cp build/manifest.json build/matrix/ 2>/dev/null || true
        - cp build/favicon.ico build/matrix/ 2>/dev/null || true
        - cp build/robots.txt build/matrix/ 2>/dev/null || true
        # إنشاء index.html للـ React app في /matrix
        - |
          cat > build/matrix/index.html << 'HTMLEOF'
          <!DOCTYPE html><html dir="rtl" lang="ar"><head>
          <meta charset="utf-8"/><meta name="viewport" content="width=device-width,initial-scale=1"/>
          <title>مصفوفة التأثير</title>
          <script>window.__BASE_URL__='/matrix';</script>
          </head><body><div id="root"></div>
          <script src="/static/js/main.chunk.js"></script>
          <script src="/static/js/bundle.js"></script>
          </body></html>
          HTMLEOF
  artifacts:
    baseDirectory: build
    files:
      - '**/*'
  cache:
    paths:
      - node_modules/**/*
