name: Schema drift check

# ليليًا: هل بنية القاعدة الحية تساوي اللقطة المودعة (supabase/schema/baseline.sql)؟
# الاختلاف يعني ترحيلًا لم يُطبَّق على الإنتاج، أو تعديلًا يدويًا في القاعدة لم يُودع.
# يفعل شيئًا فقط إن وُجد السر SUPABASE_ACCESS_TOKEN. الفشل يصل المالك ببريد GitHub.

on:
  schedule:
    - cron: '47 2 * * *'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
    steps:
      - name: Skip without a token
        id: gate
        run: |
          if [ -z "$SUPABASE_ACCESS_TOKEN" ]; then
            echo "::notice::SUPABASE_ACCESS_TOKEN is not set; schema check skipped."
            echo "skip=true" >> "$GITHUB_OUTPUT"
          fi
      - uses: actions/checkout@v4
        if: steps.gate.outputs.skip != 'true'
      - uses: actions/setup-node@v4
        if: steps.gate.outputs.skip != 'true'
        with:
          node-version: '20'
      - name: Live schema equals the committed snapshot
        if: steps.gate.outputs.skip != 'true'
        run: node scripts/db/snapshot.mjs --check
      # المحتوى المُقاس الحي (الكتيب وفقراته) يساوي ما في المستودع: أي فرق تعديل من اللوحة لم يُصالح (D01).
      # بالقراءة وحدها، ويفشل عند أول فرق فيصل المالك ببريد GitHub. المصالحة في docs/ops/دليل-المشغل-v1.md
      - name: Live measured content equals the repository
        if: steps.gate.outputs.skip != 'true' && always()
        run: node scripts/content/export-live.mjs --check

