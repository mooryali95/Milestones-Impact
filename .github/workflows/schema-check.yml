name: Nightly drift checks

# ليليًا، وظيفتان منفصلتان باسمين واضحين، فيقول البريد الأحمر أيهما انحرف:
# - schema: بنية القاعدة الحية تساوي اللقطة المودعة (supabase/schema/baseline.sql). الاختلاف يعني ترحيلًا لم يُطبَّق
#   على الإنتاج، أو تعديلًا يدويًا في القاعدة لم يُودع.
# - content: المحتوى المُقاس الحي (الكتيب وفقراته وموضوعات كاتون بكل إصداراتها) يساوي ما في المستودع (D01).
#   أي فرق تعديل من اللوحة لم يُصالح. المصالحة في docs/ops/دليل-المشغل-v1.md.
# كانتا خطوتين في وظيفة واحدة باسم Schema drift، فاحمرّت كل ليلة منذ 2026-11-11 بسبب المحتوى لا البنية
# (scripts/content/live.mjs كان يقرأ كاتون v1 وحده)، فصار البريد الأحمر بلا معنى (تصور تحديث المنصة، ص9).
# كل وظيفة تعمل فقط إن وُجد السر SUPABASE_ACCESS_TOKEN، وبالقراءة وحدها. الفشل يصل المالك ببريد GitHub.
# توقف هذه الفحوص نفسها (فوترة Actions مثلًا) يحرسه probe.yml: يحمرّ إن لم ينجح أي فحص ليلي منذ 36 ساعة.

on:
  schedule:
    - cron: '47 2 * * *'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  schema:
    name: Schema drift (live structure equals the snapshot)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    # بيئة supabase: فرعها main وحده بلا مراجعين، وفيها SUPABASE_ACCESS_TOKEN، فلا يقرؤه سير من فرع غير مدموج (RUNBOOK.md §5)
    environment: supabase
    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
    steps:
      - name: Skip without a token
        id: gate
        run: |
          if [ -z "$SUPABASE_ACCESS_TOKEN" ]; then
            echo "::notice::SUPABASE_ACCESS_TOKEN is not set; schema check skipped."
            echo "skip=true" >> "$GITHUB_OUTPUT"
          fi
      - uses: actions/checkout@v7
        if: steps.gate.outputs.skip != 'true'
      - uses: actions/setup-node@v7
        if: steps.gate.outputs.skip != 'true'
        with:
          node-version: '20'
      - name: Live schema equals the committed snapshot
        if: steps.gate.outputs.skip != 'true'
        run: node scripts/db/snapshot.mjs --check

  content:
    name: Content drift (live measured content equals the repository)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    # بيئة supabase: فرعها main وحده بلا مراجعين، وفيها SUPABASE_ACCESS_TOKEN، فلا يقرؤه سير من فرع غير مدموج (RUNBOOK.md §5)
    environment: supabase
    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
    steps:
      - name: Skip without a token
        id: gate
        run: |
          if [ -z "$SUPABASE_ACCESS_TOKEN" ]; then
            echo "::notice::SUPABASE_ACCESS_TOKEN is not set; content check skipped."
            echo "skip=true" >> "$GITHUB_OUTPUT"
          fi
      - uses: actions/checkout@v7
        if: steps.gate.outputs.skip != 'true'
      - uses: actions/setup-node@v7
        if: steps.gate.outputs.skip != 'true'
        with:
          node-version: '20'
      # بالقراءة وحدها. يطبع تقرير الفرق كاملًا ثم يفشل إن وُجد أي فرق
      - name: Live measured content equals the repository
        if: steps.gate.outputs.skip != 'true'
        run: node scripts/content/export-live.mjs --check
