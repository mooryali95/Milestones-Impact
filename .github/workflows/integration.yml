name: Integration (real Supabase)

# المسارات الذهبية على خلفية حقيقية (المرحلة ي): Supabase محلي بـDocker، الترحيلات بالترتيب كما في
# الإنتاج، الدوال تُقدَّم بـfunctions serve، ثم طلبات حقيقية تمر بالقاعدة وRLS والتوقيعات.
# اختبارات المتصفح في ci.yml تحاكي الخادم كاملًا؛ هذا السير هو الطبقة الرقيقة التي لا تحاكي شيئًا.

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  golden-paths:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      DB_URL: postgresql://postgres:postgres@127.0.0.1:54322/postgres
      API_URL: http://127.0.0.1:54321
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci --no-audit --no-fund
      # CLI من npm لا من GitHub Releases: setup-cli يستعلم واجهة GitHub بلا توكن فيُرفض بحد المعدل أحيانًا
      - name: Install Supabase CLI
        run: npm i -g supabase@latest --no-audit --no-fund && supabase --version

      - name: Start local Supabase (Postgres, PostgREST, Storage, Auth)
        run: supabase start -x studio,imgproxy,logflare,vector,realtime,mailpit,supavisor

      - name: Apply migrations in order (as production)
        run: bash scripts/integration/apply-migrations.sh

      - name: Serve edge functions
        run: |
          supabase functions serve --env-file supabase/functions/ci.env --no-verify-jwt > /tmp/functions.log 2>&1 &
          # جاهزية حقيقية: system.ping يمر بالقاعدة ويرد success. أي رد HTTP لا يكفي، لأن Kong يرد 502
          # ما دام وقت تشغيل الدوال يُقلع، فتقع أولى طلبات المسار الذهبي في نافذة الإقلاع (حدث في طلب الدمج #200)
          eval "$(supabase status -o env 2>/dev/null | grep -E '^ANON_KEY=' || true)"
          auth=(); [ -n "${ANON_KEY:-}" ] && auth=(-H "apikey: $ANON_KEY" -H "Authorization: Bearer $ANON_KEY")
          ready=
          for i in $(seq 1 60); do
            if curl -s --max-time 10 -X POST -H 'Content-Type: application/json' "${auth[@]}" \
              -d '{"action":"system.ping"}' "$API_URL/functions/v1/leaders-api" | grep -q '"success":true'; then
              ready=1; echo "leaders-api ready after $i tries"; break
            fi
            sleep 2
          done
          if [ -z "$ready" ]; then echo "::error::leaders-api did not answer system.ping within two minutes"; tail -60 /tmp/functions.log; exit 1; fi

      - name: Golden paths
        run: |
          eval "$(supabase status -o env 2>/dev/null | grep -E '^(ANON_KEY|SERVICE_ROLE_KEY)=' || true)"
          export ANON_KEY SERVICE_ROLE_KEY
          node scripts/integration/golden.mjs

      # القاعة تحت الحمل: 50 جهازًا افتراضيًا في جلسة كاملة بطلبات التطبيق نفسها، وتفشل إن ضاع رفع إصدار
      # أو بقي جهاز على حالة قديمة أو فشل طلب (scripts/integration/hall-load.mjs)
      - name: Hall under load (50 devices)
        run: |
          eval "$(supabase status -o env 2>/dev/null | grep -E '^(ANON_KEY|SERVICE_ROLE_KEY)=' || true)"
          export ANON_KEY SERVICE_ROLE_KEY
          node scripts/integration/hall-load.mjs --devices=50 --rounds=2 --round-seconds=10

      - name: Function logs
        if: always()
        run: tail -120 /tmp/functions.log || true

      - name: Stop
        if: always()
        run: supabase stop --no-backup || true
