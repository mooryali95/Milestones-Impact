name: CI

# Lint + test + build the matrix React app on every push and PR.
# Cloudflare Pages only *builds* on deploy; this adds the missing test gate
# and catches build breaks before they reach a deploy.

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# Cancel superseded runs on the same ref to save minutes.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      # `npm ci` now that a lockfile is committed. It was not, while the
      # project used react-scripts: its loose peer deps produced a lockfile
      # that `npm ci` rejected. Vite's tree resolves cleanly, so the build
      # is reproducible again.
      - name: Install dependencies
        run: npm ci --no-audit --no-fund

      # يمسك المراجع غير المعرّفة — أخطاء تشغيلية لا يكشفها البناء.
      # (فقدان استيراد عند نقل كود بين ملفات هو أشهر صورها.)
      - name: Lint
        run: npm run lint

      - name: Test
        run: npm test

      - name: Build
        run: npm run build

      # main.css وملفات JS في مجلدات المواقع كلُّها مُولَّدة من shared/
      # عبر build-css.py — كل مشروع على Pages يخدم مجلده وحده فلا
      # يُنشر shared/. نعيد التوليد ونطالب ألا يتغيّر شيء: من عدّل
      # ملفاً مُولَّداً في مكانه بدل مصدره أسقط البناء ورأى السبب.
      - name: Generated files match their sources
        run: |
          python3 shared/build-css.py
          git diff --exit-code -- home leaders src/styles/tokens.css \
            || (echo '::error::ملفٌ مُولَّد عُدِّل في مكانه. عدّل المصدر في shared/ ثم شغّل: python3 shared/build-css.py' && exit 1)
