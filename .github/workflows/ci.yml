name: CI

# الفحوص على كل طلب دمج وكل دفع إلى main، ثم (على main وحده) بوابة النشر: الدوال، ثم دفع فرع release
# إلى الإيداع المفحوص. Cloudflare Pages تبني الإنتاج من release، فلا يصل الإنتاج فحص أحمر. التراجع والنشر اليدوي: RUNBOOK.md.
#
# الترشيد (2026-11-11، بطلب المالك):
# - ما يمسه التعديل وحده: وظيفة changes تقرر بـ scripts/ops/ci-changes.mjs، والمسودات والمراجعات (docs/audit...) لا تشغّل شيئًا.
# - لا فحص مرتين للمحتوى نفسه: الطلب الأخضر يسجّل بصمة شجرته (ci-pass-<tree>)، والدفع إلى main بالشجرة نفسها ينشر بلا إعادة.
# - الاعتماديات من الذاكرة: node_modules ومتصفح Playwright وDeno.
# - وظيفتان تشغّلان ما يلزم بالخطوات: checks (الوحدات والمولّدات والدوال) وweb (البناء والرحلات).
# - npm run verify يبقى يشغّل كل شيء محليًا، ويحرس verify-parity.test.js أن كل أمر هنا موجود هناك.

on:
  push:
    branches: [main]
    paths-ignore: ['docs/audit/**', 'docs/assessment/**', 'docs/prototypes/**', 'docs/workshop/**']
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened, ready_for_review]
    paths-ignore: ['docs/audit/**', 'docs/assessment/**', 'docs/prototypes/**', 'docs/workshop/**']
  # يدويًا على فرع: الفحوص كلها (طلب الإصدار من handbook-release). على main: الفحوص كلها ثم النشر، ومعه urgent
  # لإصلاح عاجل يتجاوز نافذة النشر والتجميد (ش13، RUNBOOK.md §2)
  workflow_dispatch:
    inputs:
      urgent:
        description: 'إصلاح عاجل على main: يتجاوز نافذة النشر وتقويم التجميد'
        type: boolean
        default: false
  # النشر المؤجل (ش13): كل ثلاث ساعات (00:37 و03:37 و06:37... بتوقيت الرياض) تعمل release-gate وdeploy وحدهما، بلا فحوص،
  # فتنشر رأس main إن أُجّل نشره خارج النافذة أو في يوم تجميد وصار النشر مسموحًا. لا تعمل أصلًا (فلا دقائق) ما لم
  # يُضبط متغير المستودع DEPLOY_WINDOW، أو DEPLOY_SCHEDULE=on لمن يجمّد بلا نافذة.
  schedule:
    - cron: '37 */3 * * *'

# طلب الدمج: الدفعة الأحدث تلغي الأقدم. main: تنتظر، فلا يُقطع نشر في منتصفه.
# الجدولة في مجموعة وحدها، فلا يلغي تشغيلها المنتظر تشغيل دفع منتظرًا على main. وعلى مستوى الوظيفة لا يدخل
# deploy-production إلا نشر قررته release-gate، فتشغيل جدولة لا ينشر شيئًا لا يلغي نشرًا ولا تراجعًا منتظرًا.
concurrency:
  group: ${{ github.event_name == 'schedule' && 'ci-deferred-deploy' || format('ci-{0}', github.ref) }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read
  actions: read

jobs:
  changes:
    if: github.event_name != 'schedule' && (github.event_name != 'pull_request' || !github.event.pull_request.draft)
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    outputs:
      tree: ${{ steps.tree.outputs.tree }}
      tested: ${{ steps.dedupe.outputs.tested }}
      checks: ${{ steps.decide.outputs.checks }}
      functions: ${{ steps.decide.outputs.functions }}
      matrix: ${{ steps.decide.outputs.matrix }}
      leaders: ${{ steps.decide.outputs.leaders }}
      admin: ${{ steps.decide.outputs.admin }}
      e2e_site: ${{ steps.decide.outputs.e2e_site }}
      e2e_groups: ${{ steps.decide.outputs.e2e_groups }}
      web: ${{ steps.decide.outputs.web }}
    steps:
      # عمق 2: على طلب الدمج HEAD إيداع الدمج التجريبي وأبوه الأول قاعدته
      - uses: actions/checkout@v7
        with:
          fetch-depth: 2
      - id: tree
        run: echo "tree=$(git rev-parse 'HEAD^{tree}')" >> "$GITHUB_OUTPUT"
      # على main: شجرة اجتازت طلب دمج أخضر (والقاعدة لم تتحرك بعده) لا تُفحص ثانية
      - id: dedupe
        if: github.event_name == 'push'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          n=$(gh api "repos/${{ github.repository }}/actions/artifacts?name=ci-pass-${{ steps.tree.outputs.tree }}&per_page=1" --jq '[.artifacts[] | select(.expired == false)] | length' || echo 0)
          if [ "$n" -gt 0 ]; then echo "tested=true" >> "$GITHUB_OUTPUT"; echo "::notice::هذه الشجرة اجتازت CI في طلب الدمج؛ لا إعادة للفحوص."; fi
      - id: decide
        run: |
          if [ "${{ steps.dedupe.outputs.tested }}" = "true" ]; then
            out="checks=false functions=false matrix=false leaders=false admin=false e2e_site=false e2e_groups=[]"
          elif [ "${{ github.event_name }}" = "pull_request" ]; then
            out=$(git diff --name-only HEAD^1 HEAD | node scripts/ops/ci-changes.mjs)
          elif [ "${{ github.event_name }}" = "push" ] && git fetch --no-tags --depth=1 origin "${{ github.event.before }}" 2>/dev/null; then
            out=$(git diff --name-only "${{ github.event.before }}" HEAD | node scripts/ops/ci-changes.mjs)
          else
            out=$(node scripts/ops/ci-changes.mjs --all)
          fi
          echo "$out" | tr ' ' '\n' >> "$GITHUB_OUTPUT"
          echo "$out" | tr ' ' '\n'
          # وظيفة web تعمل إن لزم بناء أو رحلة
          if echo "$out" | grep -qE '^(matrix|leaders|admin)=true|^e2e_groups=\[.+\]'; then echo "web=true" >> "$GITHUB_OUTPUT"; fi

  # الملفات المولّدة، والأسرار، وثغرات الحزم، وLint، والوحدات، والدوال (أنواعها واختبارات Deno عند تغيّرها)
  checks:
    needs: changes
    if: needs.changes.outputs.checks == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/node-deps

      # يمسك المراجع غير المعرّفة — أخطاء تشغيلية لا يكشفها البناء.
      # النسخ المولّدة من shared/ (ومنها analytics.js في public/) يجب أن تطابق مصدرها — وإلا نُشرت نسخةٌ قديمة دون أن يلحظ أحد.
      - name: Generated files are in sync
        run: |
          python3 shared/build-css.py > /dev/null
          git diff --exit-code -- home public src/styles src/assets
          # قائمة الترحيلات التي يقرؤها فحص الصحة تطابق المجلد
          node scripts/db/migrations-list.mjs --check
          # لقطة البنية المودعة = اللقطة + ترحيلاتها (بناء محلي في PGlite)؛ الحية تُفحص ليليًا في schema-check.yml
          node scripts/db/snapshot.mjs --from-migrations --check
          # بنك القياس v5 وv5.1 وv5.2 مولَّد من مصادره ومتحقق منه (الأطوال، مسميات الأُطر، التقارب مع كتيب v3).
          # وترحيلاته مطبّقة فمجمّدة ببصماتها (applied-manifest.test.js): مصدر معدَّل يفشل هنا، ومعه ترحيله المعاد توليده هناك
          node scripts/questions/build-v5.mjs > /dev/null && node scripts/questions/build-v5_1.mjs > /dev/null && node scripts/questions/build-v5_2.mjs > /dev/null
          git diff --exit-code --stat -- supabase/content/questions/v5 supabase/content/questions/v5.1 supabase/content/questions/v5.2 supabase/migrations/20261102100000_leaders_instruments_v5.sql supabase/migrations/20261102100100_leaders_activate_v5.sql supabase/migrations/20261105150000_leaders_v5_1_pre_activation.sql supabase/migrations/20261107190000_leaders_v5_2_balance.sql
          node scripts/questions/verify-v5.mjs > /dev/null && node scripts/questions/verify-v5_1.mjs > /dev/null
          # بنك «كاتون»: الترحيل مولَّد من مصدره، والبنك يجتاز حارس الصياغة
          node scripts/katon/build-cbm-migration.mjs > /tmp/katon_cbm.sql && diff -q /tmp/katon_cbm.sql supabase/migrations/20261105160000_leaders_katon_cbm.sql
          node scripts/katon/verify.mjs > /dev/null 2>&1
          # الكتاب v3: ترحيله مولَّد من ملفاته، والأبواب تجتاز متحقق الكتيب (كتل المستوى والاختبارات والأمثلة والتأمل)
          node scripts/handbook/build-migration.mjs > /dev/null && git diff --exit-code --stat -- supabase/migrations/20261102110000_leaders_handbook_v3.sql
          node scripts/handbook/verify.mjs > /dev/null
          # كل إصدار للكتاب بعد v3 يطابق ترحيله (الإصدار المرحَّل مجمّد)، وسجل المفاهيم يربط كل فقرة محتسبة بجدارة وباب (D01 وD10)
          node scripts/handbook/build-version.mjs --check
          node scripts/concepts/registry.mjs --check

      # لا مفتاح خدمة ولا رمز وصول ولا مفتاح خاص في أي ملف مودع (مفتاح anon العام وحده مسموح)
      - name: No secrets in tracked files
        run: node scripts/ops/secrets-scan.mjs

      # ثغرات حزم الإنتاج وحدها (حزم التطوير لا تصل المستخدم)
      - name: Production dependencies audit
        run: npm audit --omit=dev --audit-level=high

      - name: Lint
        run: npm run lint

      # أنواع الدوال واختبارات Deno حين تتغير الدوال وحدها. ذاكرة Deno مخزّنة.
      # Deno بإصدار مثبّت (تصور تحديث المنصة، المرحلة 2 البند 8): إصدار جديد لا يغيّر الفحص دون طلب دمج. 2.9.8 آخر ما اخضرّ عليه CI
      - uses: denoland/setup-deno@v2
        if: needs.changes.outputs.functions == 'true'
        with:
          deno-version: 2.9.8
          cache: true
          cache-hash: ${{ hashFiles('supabase/functions/**/*.ts', 'supabase/functions/**/deno.json') }}
      # none: deno لا يعيد ترتيب node_modules، وإلا اختلف ناتج Vite بعده عن البناء المودع
      - name: Typecheck all edge functions
        if: needs.changes.outputs.functions == 'true'
        run: deno check --node-modules-dir=none supabase/functions/*/index.ts

      # اختبارات Deno للوحدات التي لا تختبرها vitest: توقيع Google، مفاتيح المرور، توقيع Creem، فحص صحة الخطافين
      - name: Deno unit tests
        if: needs.changes.outputs.functions == 'true'
        # --node-modules-dir=none: لا يكتب في node_modules (الكتابة فيه تكسر Playwright بنسختين من المكتبة)
        run: deno test --node-modules-dir=none --allow-env --allow-read --allow-net=127.0.0.1 supabase/functions/leaders-api/ supabase/functions/agent-chat/ supabase/functions/admin-api/ supabase/functions/_shared/

      - name: Test
        run: npm test

  # البناء والمبني المودع يطابق مصدره، ثم رحلات المتصفح بمجموعات ما تغيّر (scripts/ops/e2e-groups.mjs)
  web:
    needs: changes
    if: needs.changes.outputs.web == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/node-deps

      - name: Build
        if: needs.changes.outputs.matrix == 'true' || needs.changes.outputs.e2e_site == 'true'
        run: npm run build

      - name: Build leaders app
        if: needs.changes.outputs.leaders == 'true'
        run: npm run leaders:build

      # mi-leaders ينشر مجلد leaders/ المودع كما هو، فيجب أن يطابق المصدر
      - name: Leaders build is committed
        if: needs.changes.outputs.leaders == 'true'
        run: git add -N leaders && git diff --exit-code --stat -- leaders

      - name: Build admin app
        if: needs.changes.outputs.admin == 'true'
        run: npm run admin:build

      # mi-admin ينشر admin/ كما هو، فيجب أن يطابق admin/ المودع مصدره
      - name: Admin build is committed
        if: needs.changes.outputs.admin == 'true'
        run: git add -N admin && git diff --exit-code --stat -- admin

      # متصفح Playwright من الذاكرة بإصداره؛ مكتبات النظام وحدها عند الإصابة
      - name: Playwright version
        id: pw
        if: needs.changes.outputs.e2e_groups != '[]'
        run: echo "version=$(node -p "require('playwright/package.json').version")" >> "$GITHUB_OUTPUT"
      - uses: actions/cache@v6
        id: browsers
        if: needs.changes.outputs.e2e_groups != '[]'
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ steps.pw.outputs.version }}
      - name: Install Playwright browser
        if: needs.changes.outputs.e2e_groups != '[]' && steps.browsers.outputs.cache-hit != 'true'
        # مكتبات النظام الأساسية موجودة على مشغّل ubuntu-24.04، وما يُنزَّل هنا خطوط إضافية؛ إن تعطلت مرآة Ubuntu
        # (حدث 2026-11-11: Temporary failure resolving azure.archive.ubuntu.com) يُثبَّت المتصفح وحده فلا يسقط الفحص قبل أي اختبار
        run: npx playwright install --with-deps chromium || npx playwright install chromium
      - name: Install Playwright system libraries
        if: needs.changes.outputs.e2e_groups != '[]' && steps.browsers.outputs.cache-hit == 'true'
        run: npx playwright install-deps chromium || echo "::warning::تعذّر تثبيت مكتبات النظام من مرآة Ubuntu، والمثبّت على المشغّل يكفي"

      # رحلات المستخدم الأساسية من طرف المتصفح (الخلفية مُحاكاة داخل الاختبارات)، كل مجموعة بخوادمها وحدها
      - name: End-to-end tests (selected groups)
        if: needs.changes.outputs.e2e_groups != '[]'
        env:
          E2E_PREBUILT: '1'
          GROUPS: ${{ join(fromJSON(needs.changes.outputs.e2e_groups), ' ') }}
        run: for g in $GROUPS; do node scripts/ops/e2e-groups.mjs run "$g" || exit 1; done

      - uses: actions/upload-artifact@v7
        if: failure()
        with:
          name: playwright-traces
          path: test-results/
          retention-days: 7
          if-no-files-found: ignore

  # حالة واحدة للطلب، وبصمة الشجرة المفحوصة ليتخطى الدفع إلى main الفحص نفسه
  ci-ok:
    needs: [changes, checks, web]
    # workflow_dispatch: طلب الإصدار الذي يفتحه سير handbook-release بـ GITHUB_TOKEN لا يشغّل pull_request، فيُشغَّل CI عليه يدويًا
    if: always() && (github.event_name == 'pull_request' || github.event_name == 'workflow_dispatch') && needs.changes.result != 'skipped'
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: All required jobs passed or were not needed
        run: |
          for r in "${{ needs.changes.result }}" "${{ needs.checks.result }}" "${{ needs.web.result }}"; do
            case "$r" in success|skipped) ;; *) echo "::error::وظيفة انتهت بـ $r"; exit 1;; esac
          done
      - run: echo "${{ needs.changes.outputs.tree }}" > tree.txt
      - uses: actions/upload-artifact@v7
        with:
          name: ci-pass-${{ needs.changes.outputs.tree }}
          path: tree.txt
          retention-days: 14

  # ── بوابة النشر: على main وبعد خضرة الفحوص فقط ──
  # الدوال أولًا حين تغيّرت منذ آخر نشر (الخادم يقرأ الأعمدة الجديدة وتطلبه الواجهة)، ثم دخان الدوال السبع بمعيار ش6،
  # ثم تسخينها، ثم يُدفع فرع release فتبني Cloudflare Pages المنصات منه. لا شيء يصل الإنتاج إن احمرّ فحص.
  # المرحلة 2 من تصور تحديث المنصة (docs/ops/2026-11-18-تصور-تحديث-المنصة-بلا-أثر-على-المستخدمين-v1.md):
  # - نافذة النشر والتجميد (ش13): خارجهما تنجح البوابة بلا نشر، ويُترك أثر deploy-deferred-<sha> تنشره الجدولة لاحقًا.
  # - فشل نشر في منتصفه أو فشل دخان مستمر: تُعاد الدوال السبع من origin/release في الوظيفة نفسها، ثم تحمرّ الوظيفة
  #   بحالة كل دالة ولا تُرقّى الواجهة. ولا تراجع آلي إن تلا النشر ترحيلًا حاجبًا (scripts/ops/rollback-guard.mjs).
  # - تغيّرت الدوال وغاب رمز النشر: تحمرّ الوظيفة ولا تُرقّى الواجهة (ش7).
  # التنبيه: الوظيفة الحمراء وبريد GitHub عن فشل سير العمل، وملخص التشغيل بحالة كل دالة.
  #
  # القرار (نشر الآن أو تأجيل) في وظيفة release-gate بلا مجموعة تزامن، والنشر في deploy داخل deploy-production.
  # فتشغيل الجدولة الذي لا ينشر شيئًا لا يدخل المجموعة أصلًا، فلا يلغي نشر دفع منتظرًا ولا تراجعًا يدويًا منتظرًا
  # (GitHub يلغي المنتظر في المجموعة حين ينتظر غيره).
  release-gate:
    needs: [changes, checks, web]
    if: >-
      always() && github.ref == 'refs/heads/main' && (
        (github.event_name == 'schedule' && (vars.DEPLOY_WINDOW != '' || vars.DEPLOY_SCHEDULE == 'on')) ||
        ((github.event_name == 'push' || github.event_name == 'workflow_dispatch') &&
        needs.changes.result == 'success' &&
        (needs.checks.result == 'success' || needs.checks.result == 'skipped') &&
        (needs.web.result == 'success' || needs.web.result == 'skipped')))
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: read
      # قراءة آثار النشر المؤجل وتشغيلاتها (رفع الأثر لا يحتاج إذنًا)
      actions: read
    outputs:
      run: ${{ steps.go.outputs.run }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          package-manager-cache: false
      # ش13: بلا DEPLOY_WINDOW وبتقويم فارغ يُسمح دائمًا، كما كان قبل النافذة
      - name: Deploy window and freeze calendar
        id: window
        env:
          DEPLOY_WINDOW: ${{ vars.DEPLOY_WINDOW }}
          URGENT: ${{ github.event_name == 'workflow_dispatch' && inputs.urgent }}
        run: node scripts/ops/deploy-window.mjs
      - name: Deploy now or defer
        id: go
        env:
          GH_TOKEN: ${{ github.token }}
          ALLOWED: ${{ steps.window.outputs.allowed }}
          EVENT: ${{ github.event_name }}
        run: |
          if [ "$ALLOWED" != "true" ]; then
            if [ "$EVENT" != "schedule" ]; then echo "defer=true" >> "$GITHUB_OUTPUT"; fi
            exit 0
          fi
          if [ "$EVENT" = "schedule" ]; then
            # الجدولة تنشر رأس main وحده، وفقط إن أُجّل نشره: لا تعيد نشر إيداع تراجع عنه المالك أو فشل نشره.
            # والأثر لا يُقبل إلا من تشغيل دفع أو يدوي لـ ci.yml على main في هذا المستودع (scripts/ops/deferred-deploy.mjs)
            rel=$(git ls-remote origin release | cut -f1)
            if [ "$rel" = "$GITHUB_SHA" ]; then echo "::notice::release عند رأس main؛ لا نشر مؤجل."; exit 0; fi
            pending=$(node scripts/ops/deferred-deploy.mjs pending "$GITHUB_SHA")
            if [ "$pending" != "true" ]; then echo "::notice::رأس main لم يؤجَّل نشره (نُشر أو فشل أو تراجع عنه المالك)؛ لا نشر من الجدولة."; exit 0; fi
          fi
          echo "run=true" >> "$GITHUB_OUTPUT"
      - name: Record the deferred deploy
        if: steps.go.outputs.defer == 'true'
        run: |
          echo "$GITHUB_SHA" > deferred.txt
          echo "::notice::أُجّل النشر. ينشره تشغيل CI يدويًا على main، أو الجدولة حين تُفتح النافذة (RUNBOOK.md §2)."
      - uses: actions/upload-artifact@v7
        if: steps.go.outputs.defer == 'true'
        with:
          name: deploy-deferred-${{ github.sha }}
          path: deferred.txt
          # أطول من أي تجميد متوقع، فلا ينتهي الأثر قبل أن تُفتح النافذة
          retention-days: 30

  deploy:
    needs: [release-gate]
    # !cancelled: الوظائف قبل البوابة قد تُتخطى (شجرة مفحوصة، أو الجدولة)، والتخطي يسري إلى ما بعدها بلا هذا الشرط
    if: ${{ !cancelled() && needs.release-gate.result == 'success' && needs.release-gate.outputs.run == 'true' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    concurrency:
      group: deploy-production
      cancel-in-progress: false
    permissions:
      contents: write
      # حذف آثار النشر المؤجل حين يبدأ نشر
      actions: write
    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      PROJECT_REF: eormhcupwgwpllhrfxxg
      SUPABASE_CLI: 3.1.0
      # المفتاح العام (anon) كما في الواجهات؛ الدالة تتحقق من JWT فلا تقبل طلبًا بلا مفتاح
      SUPABASE_ANON: eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImVvcm1oY3Vwd2d3cGxsaHJmeHhnIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NzA3OTY2OTksImV4cCI6MjA4NjM3MjY5OX0.xbZtLH9R9mE3ogfNToojrtzQUK799y5rZrj29ggB1f0
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          package-manager-cache: false
      # النشر يبدأ: كل أثر تأجيل يُستهلك هنا (كل الصفحات)، فلا تعيده الجدولة بعد فشل أو تراجع. تعذّر القراءة يُفشل الخطوة
      - name: Consume the deferred-deploy markers
        env:
          GH_TOKEN: ${{ github.token }}
        run: node scripts/ops/deferred-deploy.mjs clear "$GITHUB_SHA"
      # الدوال تُنشر حين تغيّرت منذ آخر إيداع وصل الإنتاج (فرع release)، لا منذ الدفعة السابقة وحدها
      - name: Functions changed since the last release?
        id: fn
        run: |
          # بلا فرع النشر (أو تعذّر جلبه) تُنشر الدوال: الشك ينشر، ولا تراجع آلي لأنه لا مرجع سليم
          if git fetch --no-tags --depth=1 origin release 2>/dev/null; then
            echo "release=$(git rev-parse FETCH_HEAD)" >> "$GITHUB_OUTPUT"
            if git diff --quiet FETCH_HEAD "$GITHUB_SHA" -- supabase/functions; then
              echo "::notice::لم تتغير الدوال منذ آخر نشر؛ تُترقّى الواجهات وحدها."
              exit 0
            fi
          fi
          echo "deploy=true" >> "$GITHUB_OUTPUT"
      # ش7: الواجهة لا تسبق واجهتها البرمجية. كان تحذيرًا وحيدًا ثم ترقية (د4)
      - name: Functions changed but the deploy token is missing
        if: env.SUPABASE_ACCESS_TOKEN == '' && steps.fn.outputs.deploy == 'true'
        run: |
          echo "::error::تغيّرت الدوال وSUPABASE_ACCESS_TOKEN غير مضبوط: لا نشر للدوال ولا ترقية للواجهة. اضبط السر ثم أعد تشغيل الوظيفة (RUNBOOK.md)."
          exit 1
      - name: Functions not deployed
        if: env.SUPABASE_ACCESS_TOKEN == ''
        run: echo "::warning::SUPABASE_ACCESS_TOKEN is not set; the functions did not change, so the sites are promoted without a smoke test (see RUNBOOK.md)."
      # CLI من npm لا من GitHub Releases: setup-cli يستعلم واجهة GitHub فيفشل عند 504 أو حد المعدل (كما في integration.yml).
      # بإصدار مثبّت ومخزّن، فلا يتغير سلوك النشر بإصدار جديد ولا يُنزَّل في كل مرة.
      - uses: actions/cache@v6
        if: env.SUPABASE_ACCESS_TOKEN != '' && steps.fn.outputs.deploy == 'true'
        with:
          path: ~/.supabase-cli
          key: supabase-cli-${{ runner.os }}-${{ env.SUPABASE_CLI }}
      - name: Install Supabase CLI
        if: env.SUPABASE_ACCESS_TOKEN != '' && steps.fn.outputs.deploy == 'true'
        run: |
          [ -x ~/.supabase-cli/bin/supabase ] || npm i -g supabase@$SUPABASE_CLI --prefix ~/.supabase-cli --no-audit --no-fund
          echo "$HOME/.supabase-cli/bin" >> "$GITHUB_PATH"
          ~/.supabase-cli/bin/supabase --version
      # منذ المرحلة ل1 يفشل التحقق البشري مغلقًا: نشر الدوال بلا مفتاحَي Turnstile (أو بلا الفلفل أو مفتاح البريد)
      # يوقف الدخول برمز البريد، فيتوقف النشر هنا برسالة واضحة قبل أن يمس الإنتاج. الأسماء فقط، لا قيم.
      - name: Sign-in secrets are set on the project (names only)
        if: env.SUPABASE_ACCESS_TOKEN != '' && steps.fn.outputs.deploy == 'true'
        run: node scripts/ops/function-secrets.mjs --require=signin
      # لا تُنشر دالة قبل ترحيل تعتمد عليه: كل ترحيل في المستودع غير مطبّق في الإنتاج يوقف النشر
      # ما لم يوسم tolerant أو deferred في سطوره الأولى (scripts/ops/pending-migrations.mjs). قراءة فقط.
      - name: Pending migrations block deploy
        if: env.SUPABASE_ACCESS_TOKEN != ''
        run: node scripts/ops/pending-migrations.mjs
      # ترحيل حاجب جديد منذ release طُبّق للتو: الكود القديم قد لا يعمل عليه، فلا تراجع آلي (ق5)
      - name: Is an automatic rollback safe?
        id: guard
        if: env.SUPABASE_ACCESS_TOKEN != '' && steps.fn.outputs.deploy == 'true'
        run: node scripts/ops/rollback-guard.mjs "${{ steps.fn.outputs.release }}"
      # ش6: دخان الدوال السبع على مدى دقيقتين (scripts/ops/smoke.mjs deploy). الفشل العابر يُعاد فحصه، والمستمر
      # (3 متتالية، أو أكثر من 20% من 10) أو فشل نشر في منتصف السلسلة يعيد الدوال السبع من origin/release هنا.
      - name: Deploy edge functions, smoke, and roll back on persistent failure
        if: env.SUPABASE_ACCESS_TOKEN != '' && steps.fn.outputs.deploy == 'true'
        env:
          RELEASE_SHA: ${{ steps.fn.outputs.release }}
          AUTO_ROLLBACK: ${{ steps.guard.outputs.auto }}
        run: |
          # نشر كل دالة بثلاث محاولات: واجهة Supabase ترد أحيانًا 401 أو 5xx عابرة وسط السلسلة (حدث في 2026-11-05).
          # بعد أول دالة فشلت لا تُنشر التي تليها، فالقرار تراجع لا إكمال
          deploy() {
            [ -z "$failed" ] || return 0
            for i in 1 2 3; do
              if supabase functions deploy "$@" --project-ref "$PROJECT_REF" --yes; then return 0; fi
              echo "::warning::فشل نشر $1 (محاولة $i من 3)"; sleep $((i * 10))
            done
            failed="$1"
          }
          # الدوال السبع بترتيب FUNCTIONS في scripts/ops/smoke.mjs، من المجلد الحالي
          deploy_all() {
            failed=
            deploy leaders-api
            deploy creem-webhook --no-verify-jwt
            deploy leaders-hooks --no-verify-jwt
            deploy send-otp
            deploy admin-api
            deploy user-api
            deploy agent-chat
            [ -z "$failed" ]
          }
          reason=
          if ! deploy_all; then reason="فشل نشر $failed في منتصف السلسلة بعد ثلاث محاولات"
          elif ! node scripts/ops/smoke.mjs deploy; then reason="فشل مستمر في دخان ما بعد النشر"; fi
          if [ -z "$reason" ]; then exit 0; fi
          echo "::error::$reason"
          if [ "$AUTO_ROLLBACK" != "true" ]; then
            echo "::error::لا تراجع آلي: انظر خطوة «Is an automatic rollback safe?». الدوال كما تركها النشر، والواجهة لم تُرقَّ. القرار للمالك: RUNBOOK.md §2 (سير التراجع الموحد)."
            node scripts/ops/smoke.mjs check || true
            exit 1
          fi
          echo "::group::التراجع الآلي: الدوال السبع من release عند $RELEASE_SHA"
          git worktree add --detach "$RUNNER_TEMP/release" "$RELEASE_SHA"
          here=$PWD
          cd "$RUNNER_TEMP/release"
          if deploy_all; then rolled="أُعيدت الدوال السبع إلى $RELEASE_SHA"; else rolled="فشل التراجع نفسه عند $failed (واجهة Supabase؟)؛ الدوال مختلطة"; fi
          cd "$here"
          echo "::endgroup::"
          # حالة كل دالة بعد التراجع تصل الملخص في كل الأحوال، ولو فشل التراجع في منتصفه
          # الدخان بما تعرفه شجرة release (قد تسبق مسابير اليوم): --tree
          node scripts/ops/smoke.mjs check --tree="$RUNNER_TEMP/release" || rolled="$rolled، ودخان ما بعد التراجع فاشل"
          echo "::error::$reason. $rolled. الواجهة لم تُرقَّ. RUNBOOK.md §2."
          printf '### تراجع آلي\n\n%s\n\n%s\n' "$reason" "$rolled" >> "$GITHUB_STEP_SUMMARY"
          exit 1
      # بلا نشر للدوال (ترقية الواجهة وحدها): كل دالة سليمة بأول نجاح، وتوقف الترقية بثلاثة إخفاقات متتالية
      - name: Smoke test the live functions (no function deploy)
        if: env.SUPABASE_ACCESS_TOKEN != '' && steps.fn.outputs.deploy != 'true'
        run: node scripts/ops/smoke.mjs check
      # تسخين (د9): طلبان لكل دالة قبل ترقية الواجهة، فيدفع CI الإقلاع البارد لا المستخدم. لا يُفشل شيئًا: الحكم للدخان
      - name: Warm up the functions before promoting the sites
        if: env.SUPABASE_ACCESS_TOKEN != ''
        run: |
          ping() {
            body=$(curl -s --max-time 20 -X POST -H 'Content-Type: application/json' -H "apikey: $SUPABASE_ANON" -H "Authorization: Bearer $SUPABASE_ANON" \
              -H 'Origin: https://leaders.sunkvalue.com' -d "{\"action\":\"$2\"}" "https://$PROJECT_REF.supabase.co/functions/v1/$1?forceFunctionRegion=ap-south-1")
            echo "$1: $body"
          }
          health() {
            body=$(curl -s --max-time 20 "https://$PROJECT_REF.supabase.co/functions/v1/$1?forceFunctionRegion=ap-south-1")
            echo "$1: $body"
          }
          for i in 1 2; do
            ping leaders-api system.ping
            health creem-webhook
            health leaders-hooks
            ping send-otp ping
            ping admin-api ping
            ping user-api ping
            # agent-chat بمسباره ping: يقرأ مخزنه في القاعدة ولا يستدعي النموذج ولا يكلف شيئًا (handler.ts)
            ping agent-chat ping
          done
      - name: Promote to release (Cloudflare Pages production branch)
        run: git push --force origin "$GITHUB_SHA:refs/heads/release"
