name: CI

# Lint + test + build on every push and PR, then (on main only) the deploy
# gate: the edge functions are deployed and the `release` branch is advanced
# to the tested commit. Cloudflare Pages builds production from `release`
# (set as the production branch of each project), so a red check never
# reaches production. Rollback and manual deploys: RUNBOOK.md.

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# Cancel superseded runs on the same ref to save minutes.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-test:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      # `npm ci` now that a lockfile is committed. It was not, while the
      # project used react-scripts: its loose peer deps produced a lockfile
      # that `npm ci` rejected. Vite's tree resolves cleanly, so the build
      # is reproducible again.
      - name: Install dependencies
        run: npm ci --no-audit --no-fund

      # يمسك المراجع غير المعرّفة — أخطاء تشغيلية لا يكشفها البناء.
      # (فقدان استيراد عند نقل كود بين ملفات هو أشهر صورها.)
      # النسخ المولّدة من shared/ (ومنها analytics.js في public/) يجب
      # أن تطابق مصدرها — وإلا نُشرت نسخةٌ قديمة دون أن يلحظ أحد.
      - name: Generated files are in sync
        run: |
          python3 shared/build-css.py > /dev/null
          git diff --exit-code -- home public src/styles src/assets
          # قائمة الترحيلات التي يقرؤها فحص الصحة تطابق المجلد
          node scripts/db/migrations-list.mjs --check
          # لقطة البنية المودعة = اللقطة + ترحيلاتها (بناء محلي في PGlite)؛ الحية تُفحص ليليًا في schema-check.yml
          node scripts/db/snapshot.mjs --from-migrations --check
          # بنك القياس v5 وv5.1 مولَّد من مصادره ومتحقق منه (الأطوال، مسميات الأُطر، التقارب مع كتيب v3)
          node scripts/questions/build-v5.mjs > /dev/null && node scripts/questions/build-v5_1.mjs > /dev/null
          git diff --exit-code --stat -- supabase/content/questions/v5 supabase/content/questions/v5.1 supabase/migrations/20261102100000_leaders_instruments_v5.sql supabase/migrations/20261102100100_leaders_activate_v5.sql supabase/migrations/20261105150000_leaders_v5_1_pre_activation.sql
          node scripts/questions/verify-v5.mjs > /dev/null && node scripts/questions/verify-v5_1.mjs > /dev/null
          # بنك «كاتون»: الترحيل مولَّد من مصدره، والبنك يجتاز حارس الصياغة
          node scripts/katon/build-cbm-migration.mjs > /tmp/katon_cbm.sql && diff -q /tmp/katon_cbm.sql supabase/migrations/20261105160000_leaders_katon_cbm.sql
          node scripts/katon/verify.mjs > /dev/null 2>&1

      - name: Lint
        run: npm run lint

      # أنواع دالة leaders-api: صفر أخطاء، فأي خطأ جديد يُكتشف قبل النشر
      - uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x
      - name: Typecheck edge functions
        run: deno check --node-modules-dir=auto supabase/functions/leaders-api/index.ts supabase/functions/creem-webhook/index.ts supabase/functions/leaders-hooks/index.ts

      - name: Test
        run: npm test

      - name: Build
        run: npm run build

      - name: Build leaders app
        run: npm run leaders:build

      # mi-leaders ينشر مجلد leaders/ المودع كما هو، فيجب أن يطابق المصدر
      - name: Leaders build is committed
        run: git add -N leaders && git diff --exit-code --stat -- leaders

      - name: Build admin app
        run: npm run admin:build

      # mi-admin ينشر admin/ كما هو، فيجب أن يطابق admin/ المودع مصدره
      - name: Admin build is committed
        run: git add -N admin && git diff --exit-code --stat -- admin

      # رحلات المستخدم الأساسية من طرف المتصفح (الخلفية مُحاكاة داخل الاختبارات)
      - name: Install Playwright browser
        run: npx playwright install --with-deps chromium

      - name: End-to-end tests
        run: npm run e2e

  # ── بوابة النشر: على main وبعد خضرة الفحوص فقط ──
  # الدوال أولًا (الخادم يقرأ الأعمدة الجديدة وتطلبه الواجهة)، ثم مسبار حقيقي،
  # ثم يُدفع فرع release فتبني Cloudflare Pages المنصات منه. لا شيء يصل الإنتاج إن احمرّ فحص.
  deploy:
    needs: build-and-test
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    concurrency:
      group: deploy-production
      cancel-in-progress: false
    permissions:
      contents: write
    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      PROJECT_REF: eormhcupwgwpllhrfxxg
      # المفتاح العام (anon) كما في الواجهات؛ الدالة تتحقق من JWT فلا تقبل طلبًا بلا مفتاح
      SUPABASE_ANON: eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImVvcm1oY3Vwd2d3cGxsaHJmeHhnIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NzA3OTY2OTksImV4cCI6MjA4NjM3MjY5OX0.xbZtLH9R9mE3ogfNToojrtzQUK799y5rZrj29ggB1f0
    steps:
      - uses: actions/checkout@v4
      - uses: supabase/setup-cli@v1
        if: env.SUPABASE_ACCESS_TOKEN != ''
        with:
          version: latest
      - name: Deploy edge functions
        if: env.SUPABASE_ACCESS_TOKEN != ''
        run: |
          supabase functions deploy leaders-api --project-ref "$PROJECT_REF" --yes
          supabase functions deploy creem-webhook --project-ref "$PROJECT_REF" --no-verify-jwt --yes
          supabase functions deploy leaders-hooks --project-ref "$PROJECT_REF" --no-verify-jwt --yes
          supabase functions deploy send-otp --project-ref "$PROJECT_REF" --yes
      - name: Functions not deployed
        if: env.SUPABASE_ACCESS_TOKEN == ''
        run: echo "::warning::SUPABASE_ACCESS_TOKEN is not set; edge functions were not deployed (see RUNBOOK.md)."
      - name: Smoke test leaders-api with a real request
        if: env.SUPABASE_ACCESS_TOKEN != ''
        run: |
          body=$(curl -s -X POST -H 'Content-Type: application/json' -H "apikey: $SUPABASE_ANON" -H "Authorization: Bearer $SUPABASE_ANON" \
            -H 'Origin: https://leaders.sunkvalue.com' -d '{"action":"system.ping"}' "https://$PROJECT_REF.supabase.co/functions/v1/leaders-api")
          echo "$body"
          echo "$body" | grep -q '"success":true'
      - name: Promote to release (Cloudflare Pages production branch)
        run: git push --force origin "$GITHUB_SHA:refs/heads/release"
