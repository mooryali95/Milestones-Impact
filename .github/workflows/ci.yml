name: CI

# Lint + test + build the matrix React app on every push and PR.
# Cloudflare Pages only *builds* on deploy; this adds the missing test gate
# and catches build breaks before they reach a deploy.

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# Cancel superseded runs on the same ref to save minutes.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      # `npm ci` now that a lockfile is committed. It was not, while the
      # project used react-scripts: its loose peer deps produced a lockfile
      # that `npm ci` rejected. Vite's tree resolves cleanly, so the build
      # is reproducible again.
      - name: Install dependencies
        run: npm ci --no-audit --no-fund

      # يمسك المراجع غير المعرّفة — أخطاء تشغيلية لا يكشفها البناء.
      # (فقدان استيراد عند نقل كود بين ملفات هو أشهر صورها.)
      # النسخ المولّدة من shared/ (ومنها analytics.js في public/) يجب
      # أن تطابق مصدرها — وإلا نُشرت نسخةٌ قديمة دون أن يلحظ أحد.
      - name: Generated files are in sync
        run: |
          python3 shared/build-css.py > /dev/null
          git diff --exit-code -- home public src/styles src/assets

      - name: Lint
        run: npm run lint

      - name: Test
        run: npm test

      - name: Build
        run: npm run build

      - name: Build leaders app
        run: npm run leaders:build

      # mi-leaders ينشر مجلد leaders/ المودع كما هو، فيجب أن يطابق المصدر
      - name: Leaders build is committed
        run: git add -N leaders && git diff --exit-code --stat -- leaders

      - name: Build admin app
        run: npm run admin:build

      # mi-admin ينشر admin/ كما هو، فيجب أن يطابق admin/next/ المودع مصدره
      - name: Admin build is committed
        run: git add -N admin/next && git diff --exit-code --stat -- admin/next

      # رحلات المستخدم الأساسية من طرف المتصفح (الخلفية مُحاكاة داخل الاختبارات)
      - name: Install Playwright browser
        run: npx playwright install --with-deps chromium

      - name: End-to-end tests
        run: npm run e2e
