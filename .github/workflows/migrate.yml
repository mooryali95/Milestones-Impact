name: Apply migrations (production)

# ترحيلات SQL على القاعدة الحية بقرار المالك: يُشغَّل يدويًا بأسماء الترحيلات بالترتيب، عبر
# Management API بالسر SUPABASE_ACCESS_TOKEN نفسه الذي ينشر الدوال (RUNBOOK.md §1).
# المسجّل سلفًا في leaders.schema_migrations يُتخطى، وأول فشل يوقف السلسلة ويُظهر خطأ القاعدة في السجل.
# الوضع check قراءة فقط: يطبع الجدولة الحية (cron.job وآخر تشغيلاتها) وأسماء أسرار Vault بلا قيم
# وسجل الترحيلات وأسماء أسرار الدوال (ومنها مفتاحا Turnstile)، ولا يغيّر شيئًا (RUNBOOK.md §3).

on:
  workflow_dispatch:
    inputs:
      mode:
        description: 'apply = تطبيق الترحيلات المسمّاة · check = قراءة الجدولة والسجل فقط'
        required: true
        type: choice
        default: apply
        options:
          - apply
          - check
      migrations:
        description: 'أسماء الترحيلات بالترتيب مفصولة بمسافة (بلا .sql)؛ تُهمل في وضع check'
        required: false
        type: string

permissions:
  contents: read

jobs:
  migrate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      MODE: ${{ inputs.mode }}
      MIGRATIONS: ${{ inputs.migrations }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 20
      - name: Token missing
        if: env.SUPABASE_ACCESS_TOKEN == ''
        run: echo "::error::SUPABASE_ACCESS_TOKEN is not set (see RUNBOOK.md §1)" && exit 1
      - name: Check the live schedule and ledger (read only)
        if: env.MODE == 'check'
        run: node scripts/db/apply-migration.mjs --check
      # أسماء أسرار الدوال فقط (لا قيم)، ويفشل إن غاب سرّ يحتاجه الدخول بالرمز؛ يعمل ولو فشلت الخطوة السابقة
      - name: Function secrets the sign-in needs (names only)
        if: ${{ !cancelled() && env.MODE == 'check' }}
        run: node scripts/ops/function-secrets.mjs --require=signin
      - name: Nothing to apply
        if: env.MODE == 'apply' && env.MIGRATIONS == ''
        run: echo "::error::سمِّ ترحيلًا واحدًا على الأقل في المدخل migrations" && exit 1
      - name: Apply in order
        if: env.MODE == 'apply' && env.MIGRATIONS != ''
        run: node scripts/db/apply-migration.mjs $MIGRATIONS
