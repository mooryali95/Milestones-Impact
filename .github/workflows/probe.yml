name: Production probe

# مسبار احتياطي كل ثلاث ساعات (كان كل ساعة حتى 2026-11-11؛ خُفّض لترشيد دقائق Actions، فكل تشغيل يُحتسب دقيقة كاملة): طلب حقيقي إلى كل دالة تخدم واجهة (leaders-api وadmin-api وuser-api)
# يمر بالقاعدة، وصفحات المنصات الثلاث. فشل أي منها يُفشل السير، فيصل المالك بريد GitHub عن فشل سير العمل.
# جدولة GitHub قد تتأخر ساعات، فالمراقب الخارجي كل 5 دقائق (RUNBOOK.md) هو الأساس
# وهذا شبكة أمان له.

on:
  schedule:
    - cron: '23 */3 * * *'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      PROJECT_REF: eormhcupwgwpllhrfxxg
      SUPABASE_ANON: eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImVvcm1oY3Vwd2d3cGxsaHJmeHhnIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NzA3OTY2OTksImV4cCI6MjA4NjM3MjY5OX0.xbZtLH9R9mE3ogfNToojrtzQUK799y5rZrj29ggB1f0
    steps:
      - name: The functions answer real requests
        run: |
          ping() {
            body=$(curl -s --max-time 20 -X POST -H 'Content-Type: application/json' -H "apikey: $SUPABASE_ANON" -H "Authorization: Bearer $SUPABASE_ANON" \
              -H 'Origin: https://leaders.sunkvalue.com' -d "{\"action\":\"$2\"}" "https://$PROJECT_REF.supabase.co/functions/v1/$1?forceFunctionRegion=ap-south-1")
            echo "$1: $body"
            echo "$body" | grep -q '"success":true'
          }
          ping leaders-api system.ping
          ping admin-api ping
          ping user-api ping
      # Cloudflare قد يحجب عناوين مشغّلات GitHub على النطاق (403 مع server: cloudflare) وهذا ليس تعطلًا؛
      # عندها يُفحص النشر نفسه على pages.dev (أصل Cloudflare Pages بلا قواعد النطاق)، ولا يُقبل إلا بعنوان صفحة
      # فيه Milestone Impact، فلا يمر موقع آخر على العنوان نفسه. غير ذلك يُفشل السير.
      # mi.sunkvalue.com بلا بديل حتى يُعرف اسم مشروعه الحقيقي على pages.dev من Cloudflare: mi-home.pages.dev موقع شركة أخرى.
      - name: Sites answer
        run: |
          probe() {
            code=$(curl -s --max-time 20 -o /dev/null -D /tmp/h -A "MilestoneImpactProbe/1.0 (+https://mi.sunkvalue.com)" -w '%{http_code}' "$1")
            echo "$1 -> $code"
            if [ "$code" = 200 ]; then return 0; fi
            if [ "$code" = 403 ] && grep -qi '^server: cloudflare' /tmp/h; then
              if [ -z "$2" ]; then echo "::error::$1 حُجب بـ403 من Cloudflare لعنوان المشغّل ولا بديل له على pages.dev؛ أضف قاعدة التخطي لوكيل المسبار (RUNBOOK §3)"; return 1; fi
              echo "::warning::$1 حُجب بـ403 من Cloudflare لعنوان المشغّل (ليس تعطلًا)؛ يُفحص النشر على $2"
              code2=$(curl -s --max-time 20 -o /tmp/b -w '%{http_code}' "$2"); echo "$2 -> $code2"
              test "$code2" = 200 || return 1
              grep -qi '<title>[^<]*Milestone Impact' /tmp/b || { echo "::error::$2 لا يحمل عنوانه Milestone Impact؛ ليس نشر المنصة"; return 1; }
              return 0
            fi
            return 1
          }
          probe https://leaders.sunkvalue.com/ https://mi-leaders.pages.dev/
          probe https://mi.sunkvalue.com/
          probe https://admin.sunkvalue.com/ https://mi-admin.pages.dev/
