name: Deploy functions (manual)

# النشر الاعتيادي يتم في ci.yml (الوظيفة deploy) بعد خضرة الفحوص على main.
# هذا السير للنشر اليدوي أو للتراجع: شغّله من Actions واختر الفرع أو الوسم
# أو الإيداع القديم في «Use workflow from»، فتُنشر الدوال الست من ذلك المرجع.
# يفعل شيئًا فقط إن وُجد السر SUPABASE_ACCESS_TOKEN (حساب Supabase، Access Tokens).
# ترحيلات SQL لا تُنشر هنا: تُطبَّق بقرار المالك عبر migrate.yml (بأسمائها، مع سجل
# leaders.schema_migrations)، ووضعه check يقرأ الجدولة والسجل بلا تغيير.

on:
  workflow_dispatch:

concurrency:
  group: deploy-production
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      PROJECT_REF: eormhcupwgwpllhrfxxg
      SUPABASE_ANON: eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImVvcm1oY3Vwd2d3cGxsaHJmeHhnIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NzA3OTY2OTksImV4cCI6MjA4NjM3MjY5OX0.xbZtLH9R9mE3ogfNToojrtzQUK799y5rZrj29ggB1f0
    steps:
      - name: Skip without a token
        id: gate
        run: |
          if [ -z "$SUPABASE_ACCESS_TOKEN" ]; then
            echo "::notice::SUPABASE_ACCESS_TOKEN is not set; deploy by hand (RUNBOOK.md)."
            echo "skip=true" >> "$GITHUB_OUTPUT"
          fi
      - uses: actions/checkout@v7
        if: steps.gate.outputs.skip != 'true'
      - uses: actions/setup-node@v4
        if: steps.gate.outputs.skip != 'true'
        with:
          node-version: '20'
      # CLI من npm لا من GitHub Releases (كما في ci.yml وintegration.yml)
      - name: Install Supabase CLI
        if: steps.gate.outputs.skip != 'true'
        run: npm i -g supabase@latest --no-audit --no-fund && supabase --version
      # كما في ci.yml: ترحيل حاجب غير مطبّق يوقف النشر. التراجع إلى إيداع أقدم يمر لأن ترحيلاته مطبّقة،
      # والإيداعات السابقة لهذه البوابة بلا السكربت فتُتخطى.
      - name: Pending migrations block deploy
        if: steps.gate.outputs.skip != 'true'
        run: if [ -f scripts/ops/pending-migrations.mjs ]; then node scripts/ops/pending-migrations.mjs; fi
      - name: Deploy
        if: steps.gate.outputs.skip != 'true'
        run: |
          # نشر كل دالة بثلاث محاولات: واجهة Supabase ترد أحيانًا 401 أو 5xx عابرة وسط السلسلة (حدث في 2026-11-05)
          deploy() {
            for i in 1 2 3; do
              if supabase functions deploy "$@" --project-ref "$PROJECT_REF" --yes; then return 0; fi
              echo "::warning::فشل نشر $1 (محاولة $i من 3)"; sleep $((i * 10))
            done
            return 1
          }
          deploy leaders-api
          deploy creem-webhook --no-verify-jwt
          deploy leaders-hooks --no-verify-jwt
          deploy send-otp
          deploy admin-api
          deploy user-api
      - name: Verify the live functions answer real requests
        if: steps.gate.outputs.skip != 'true'
        run: |
          ping() {
            body=$(curl -s --max-time 20 -X POST -H 'Content-Type: application/json' -H "apikey: $SUPABASE_ANON" -H "Authorization: Bearer $SUPABASE_ANON" \
              -H 'Origin: https://leaders.sunkvalue.com' -d "{\"action\":\"$2\"}" "https://$PROJECT_REF.supabase.co/functions/v1/$1")
            echo "$1: $body"
            echo "$body" | grep -q '"success":true'
          }
          ping leaders-api system.ping
          ping admin-api ping
          ping user-api ping
