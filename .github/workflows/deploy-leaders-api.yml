name: Deploy functions (manual)

# النشر الاعتيادي يتم في ci.yml (الوظيفة deploy) بعد خضرة الفحوص على main.
# هذا السير للنشر اليدوي أو للتراجع: شغّله من Actions واختر الفرع أو الوسم
# أو الإيداع القديم في «Use workflow from»، فتُنشر الدوال الأربع من ذلك المرجع.
# يفعل شيئًا فقط إن وُجد السر SUPABASE_ACCESS_TOKEN (حساب Supabase، Access Tokens).
# ترحيلات SQL تبقى يدوية: القاعدة الحية بلا سجل ترحيلات، فـ`supabase db push`
# كان سيعيد تشغيلها كلها.

on:
  workflow_dispatch:

concurrency:
  group: deploy-production
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      PROJECT_REF: eormhcupwgwpllhrfxxg
      SUPABASE_ANON: eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImVvcm1oY3Vwd2d3cGxsaHJmeHhnIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NzA3OTY2OTksImV4cCI6MjA4NjM3MjY5OX0.xbZtLH9R9mE3ogfNToojrtzQUK799y5rZrj29ggB1f0
    steps:
      - name: Skip without a token
        id: gate
        run: |
          if [ -z "$SUPABASE_ACCESS_TOKEN" ]; then
            echo "::notice::SUPABASE_ACCESS_TOKEN is not set; deploy by hand (RUNBOOK.md)."
            echo "skip=true" >> "$GITHUB_OUTPUT"
          fi
      - uses: actions/checkout@v4
        if: steps.gate.outputs.skip != 'true'
      - uses: supabase/setup-cli@v1
        if: steps.gate.outputs.skip != 'true'
        with:
          version: latest
      - name: Deploy
        if: steps.gate.outputs.skip != 'true'
        run: |
          supabase functions deploy leaders-api --project-ref "$PROJECT_REF" --yes
          supabase functions deploy creem-webhook --project-ref "$PROJECT_REF" --no-verify-jwt --yes
          supabase functions deploy leaders-hooks --project-ref "$PROJECT_REF" --no-verify-jwt --yes
          supabase functions deploy send-otp --project-ref "$PROJECT_REF" --yes
      - name: Verify the live function answers a real request
        if: steps.gate.outputs.skip != 'true'
        run: |
          body=$(curl -s -X POST -H 'Content-Type: application/json' -H "apikey: $SUPABASE_ANON" -H "Authorization: Bearer $SUPABASE_ANON" \
            -H 'Origin: https://leaders.sunkvalue.com' -d '{"action":"system.ping"}' "https://$PROJECT_REF.supabase.co/functions/v1/leaders-api")
          echo "$body"
          echo "$body" | grep -q '"success":true'
