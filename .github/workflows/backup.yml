name: Nightly database backup

# النسخ الاحتياطي خارج GitHub (D09): scripts/ops/backup.sh نفسه الذي يشغله المالك من جهازه أثناء حجب Actions.
# يفرّغ مخططات leaders وpublic وauth ودلو leaders-private، ويشفّر عند المصدر بالمفتاح العام، ويرفع إلى R2
# مع بيان بالبصمات وعدد الصفوف. نسخة أدوات السير (طبقة ثانية 30 يومًا) لا تُرفع ما دام المستودع عامًا.
# الأسرار:
#   SUPABASE_DB_URL         سلسلة الاتصال (Session pooler)
#   BACKUP_PUBLIC_KEY       سطر age1 لكل مستلم (المعتمد)، أو كتلة GnuPG لكل مفتاح. المفتاح الخاص عند المالك خارج GitHub وCloudflare
#   BACKUP_PASSPHRASE       التشفير المتماثل القديم، يُحذف بعد أول نسخة بالمفتاح العام (RUNBOOK.md §4)
#   SUPABASE_SERVICE_ROLE_KEY  نسخ دلو الملفات الخاصة
#   R2_ACCOUNT_ID وR2_ACCESS_KEY_ID وR2_SECRET_ACCESS_KEY وR2_BUCKET  رمز مقصور على الدلو، وقفل احتفاظ في الدلو
# الاستعادة والتمرين: RUNBOOK.md §4 وscripts/ops/restore-drill.sh.

on:
  schedule:
    - cron: '30 0 * * *'   # 03:30 Riyadh
  workflow_dispatch:

permissions:
  contents: read

jobs:
  backup:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    # بيئة backup: يضع المالك فيها SUPABASE_SERVICE_ROLE_KEY ويحصرها في فرع main بلا مراجعين (RUNBOOK.md §4)، فلا يقرأ
    # مفتاح الخدمة سيرٌ من فرع آخر، ولا تنتظر النسخة الليلية موافقة أحد
    environment: backup
    env:
      SUPABASE_DB_URL: ${{ secrets.SUPABASE_DB_URL }}
      BACKUP_PUBLIC_KEY: ${{ secrets.BACKUP_PUBLIC_KEY }}
      BACKUP_PASSPHRASE: ${{ secrets.BACKUP_PASSPHRASE }}
      SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
      SUPABASE_URL: https://eormhcupwgwpllhrfxxg.supabase.co
      R2_ACCOUNT_ID: ${{ secrets.R2_ACCOUNT_ID }}
      R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
      R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
      R2_BUCKET: ${{ secrets.R2_BUCKET }}
      BACKUP_OUT: backup-out
    steps:
      # سرّ ناقص يُفشل التشغيل فيصل بريد الفشل، ولا يمر أخضر بلا نسخة: بعد حذف BACKUP_PASSPHRASE يصير ضياع
      # BACKUP_PUBLIC_KEY ليلة حمراء لا تخطيًا صامتًا. وR2 إلزامي: بلا أدوات سير في المستودع العام هو المكان الوحيد للنسخة
      - name: Required secrets are set
        run: |
          if [ -z "$SUPABASE_DB_URL" ] || { [ -z "$BACKUP_PUBLIC_KEY" ] && [ -z "$BACKUP_PASSPHRASE" ]; }; then
            echo "::error::SUPABASE_DB_URL or an encryption key (BACKUP_PUBLIC_KEY) is not set; no backup taken."
            exit 1
          fi
          if [ -z "$R2_ACCOUNT_ID" ] || [ -z "$R2_ACCESS_KEY_ID" ] || [ -z "$R2_SECRET_ACCESS_KEY" ] || [ -z "$R2_BUCKET" ]; then
            echo "::error::An R2 secret (R2_ACCOUNT_ID, R2_ACCESS_KEY_ID, R2_SECRET_ACCESS_KEY, R2_BUCKET) is not set; the backup would be stored nowhere."
            exit 1
          fi
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '20'
      # age أداة التشفير المعتمدة بالمفتاح العام (RUNBOOK.md §4)، وليست في صورة المشغّل
      - name: Install age
        run: command -v age >/dev/null || { sudo apt-get update -qq && sudo apt-get install -y -qq age; }
      - name: Dump, encrypt at the source, and upload to R2
        run: bash scripts/ops/backup.sh
      # نسخة القاعدة رُفعت قبل هذه الخطوة. بلا مفتاح الخدمة لا يُنسخ دلو leaders-private (السير والأدلة)، فيحمرّ التشغيل
      # ليُرى النقص، ولا يُطمس بتحذير في سجل لا يقرؤه أحد
      - name: The private files bucket was included
        run: |
          if [ -z "$SUPABASE_SERVICE_ROLE_KEY" ]; then
            echo "::error::SUPABASE_SERVICE_ROLE_KEY is not set (environment backup): the database copy is in R2, but the leaders-private bucket (CVs and evidence) was not backed up."
            exit 1
          fi
      # الطبقة الثانية تُحفظ ولو فشل الرفع إلى R2 (ops-2: فشل 409 فضاعت معه)، والمشفّر والبيان وحدهما: تفريغ قطعه
      # خطأ قبل تشفيره يبقى صريحًا في المجلد ولا يُرفع
      # في مستودع عام أدوات السير يحمّلها أي حساب GitHub: النسخة المشفّرة لا تُنشر هناك، والطبقة الباقية R2 وحده.
      # تعود هذه الطبقة تلقائيًا حين يعود المستودع خاصًا
      - uses: actions/upload-artifact@v7
        if: ${{ !cancelled() && github.repository_visibility != 'public' }}
        with:
          name: backup-${{ github.run_id }}
          path: |
            backup-out/*.age
            backup-out/*.gpg
            backup-out/manifest-*.json
          retention-days: 30
          if-no-files-found: error
