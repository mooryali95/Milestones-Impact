name: Nightly database backup

# The Supabase free plan has no daily backups. This dumps the `leaders` and
# `public` schemas every night, encrypts the dump, and keeps it as a private
# workflow artifact for 30 days. It does nothing until both repository
# secrets exist:
#   SUPABASE_DB_URL     the "Session pooler" connection string (Database settings)
#   BACKUP_PASSPHRASE   any long passphrase; keep a copy outside GitHub
# With SUPABASE_SERVICE_ROLE_KEY as well, the private Storage bucket
# (leaders-private: CVs, evidence) is downloaded and kept as a second artifact.
# Restore: gpg -d leaders-YYYY-MM-DD.dump.gpg > db.dump && pg_restore -d "$URL" --clean db.dump
# A monthly restore drill lives in restore-drill.yml.

on:
  schedule:
    - cron: '30 0 * * *'   # 03:30 Riyadh
  workflow_dispatch:

permissions:
  contents: read

jobs:
  backup:
    runs-on: ubuntu-latest
    env:
      DB_URL: ${{ secrets.SUPABASE_DB_URL }}
      PASSPHRASE: ${{ secrets.BACKUP_PASSPHRASE }}
      SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
      SUPABASE_URL: https://eormhcupwgwpllhrfxxg.supabase.co
    steps:
      - name: Skip without secrets
        id: gate
        run: |
          if [ -z "$DB_URL" ] || [ -z "$PASSPHRASE" ]; then
            echo "::notice::SUPABASE_DB_URL or BACKUP_PASSPHRASE is not set; no backup taken."
            echo "skip=true" >> "$GITHUB_OUTPUT"
          fi
      - name: Dump and encrypt
        if: steps.gate.outputs.skip != 'true'
        run: |
          name="leaders-$(date -u +%F).dump"
          # pg_dump must be at least the server's major version
          docker run --rm -e DB_URL postgres:17 sh -c 'pg_dump "$DB_URL" --schema=leaders --schema=public --no-owner --no-privileges -Fc' > "$name"
          test -s "$name"
          gpg --batch --yes --pinentry-mode loopback --passphrase "$PASSPHRASE" --symmetric --cipher-algo AES256 -o "$name.gpg" "$name"
          rm "$name"
          echo "FILE=$name.gpg" >> "$GITHUB_ENV"
          ls -l "$name.gpg"
      - uses: actions/upload-artifact@v4
        if: steps.gate.outputs.skip != 'true'
        with:
          name: ${{ env.FILE }}
          path: ${{ env.FILE }}
          retention-days: 30
          if-no-files-found: error

      # الملفات المرفوعة (السير الذاتية والأدلة) ليست في الـdump؛ تُنزَّل من الدلو الخاص
      - uses: actions/checkout@v4
        if: steps.gate.outputs.skip != 'true' && env.SERVICE_KEY != ''
      - uses: actions/setup-node@v4
        if: steps.gate.outputs.skip != 'true' && env.SERVICE_KEY != ''
        with:
          node-version: '20'
      - name: Download the private storage bucket and encrypt
        if: steps.gate.outputs.skip != 'true' && env.SERVICE_KEY != ''
        env:
          SUPABASE_SERVICE_ROLE_KEY: ${{ env.SERVICE_KEY }}
        run: |
          node scripts/db/backup-storage.mjs storage leaders-private
          name="storage-$(date -u +%F).tar.gz"
          tar czf "$name" storage
          gpg --batch --yes --pinentry-mode loopback --passphrase "$PASSPHRASE" --symmetric --cipher-algo AES256 -o "$name.gpg" "$name"
          rm -rf "$name" storage
          echo "STORAGE_FILE=$name.gpg" >> "$GITHUB_ENV"
          ls -l "$name.gpg"
      - name: Storage not backed up
        if: steps.gate.outputs.skip != 'true' && env.SERVICE_KEY == ''
        run: echo "::warning::SUPABASE_SERVICE_ROLE_KEY is not set; the leaders-private bucket (CVs, evidence) was not backed up."
      - uses: actions/upload-artifact@v4
        if: steps.gate.outputs.skip != 'true' && env.SERVICE_KEY != ''
        with:
          name: ${{ env.STORAGE_FILE }}
          path: ${{ env.STORAGE_FILE }}
          retention-days: 30
          if-no-files-found: error
