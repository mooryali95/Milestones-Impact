name: Nightly database backup

# النسخ الاحتياطي خارج GitHub (D09): scripts/ops/backup.sh نفسه الذي يشغله المالك من جهازه أثناء حجب Actions.
# يفرّغ مخططات leaders وpublic وauth ودلو leaders-private، ويشفّر عند المصدر بالمفتاح العام، ويرفع إلى R2
# مع بيان بالبصمات وعدد الصفوف، ويبقي نسخة مشفرة في أدوات السير 30 يومًا طبقة ثانية.
# الأسرار:
#   SUPABASE_DB_URL         سلسلة الاتصال (Session pooler)
#   BACKUP_PUBLIC_KEY       المفتاح العام (gpg --armor --export). المفتاح الخاص عند المالك خارج GitHub وCloudflare
#   BACKUP_PASSPHRASE       التشفير المتماثل القديم، حتى يُضبط المفتاح العام فقط
#   SUPABASE_SERVICE_ROLE_KEY  نسخ دلو الملفات الخاصة
#   R2_ACCOUNT_ID وR2_ACCESS_KEY_ID وR2_SECRET_ACCESS_KEY وR2_BUCKET  رمز مقصور على الدلو، وقفل احتفاظ في الدلو
# الاستعادة والتمرين: RUNBOOK.md §4 وscripts/ops/restore-drill.sh.

on:
  schedule:
    - cron: '30 0 * * *'   # 03:30 Riyadh
  workflow_dispatch:

permissions:
  contents: read

jobs:
  backup:
    runs-on: ubuntu-latest
    env:
      SUPABASE_DB_URL: ${{ secrets.SUPABASE_DB_URL }}
      BACKUP_PUBLIC_KEY: ${{ secrets.BACKUP_PUBLIC_KEY }}
      BACKUP_PASSPHRASE: ${{ secrets.BACKUP_PASSPHRASE }}
      SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
      SUPABASE_URL: https://eormhcupwgwpllhrfxxg.supabase.co
      R2_ACCOUNT_ID: ${{ secrets.R2_ACCOUNT_ID }}
      R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
      R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
      R2_BUCKET: ${{ secrets.R2_BUCKET }}
      BACKUP_OUT: backup-out
    steps:
      - name: Skip without secrets
        id: gate
        run: |
          if [ -z "$SUPABASE_DB_URL" ] || { [ -z "$BACKUP_PUBLIC_KEY" ] && [ -z "$BACKUP_PASSPHRASE" ]; }; then
            echo "::notice::SUPABASE_DB_URL or an encryption key (BACKUP_PUBLIC_KEY, or BACKUP_PASSPHRASE) is not set; no backup taken."
            echo "skip=true" >> "$GITHUB_OUTPUT"
          fi
      - uses: actions/checkout@v4
        if: steps.gate.outputs.skip != 'true'
      - uses: actions/setup-node@v4
        if: steps.gate.outputs.skip != 'true'
        with:
          node-version: '20'
      - name: Dump, encrypt at the source, and upload to R2
        if: steps.gate.outputs.skip != 'true'
        run: bash scripts/ops/backup.sh
      - uses: actions/upload-artifact@v4
        if: steps.gate.outputs.skip != 'true'
        with:
          name: backup-${{ github.run_id }}
          path: backup-out/
          retention-days: 30
          if-no-files-found: error
