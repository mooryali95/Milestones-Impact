name: Backup restore drill

# نسخة لم تُستعد قط ليست نسخة (D09).
# - r2: كل يوم، فحص النسخة في R2 بلا فك تشفير: عمرها دون 36 ساعة، وكل ملف في البيان بحجمه، والتشفير بالمفتاح العام.
# - legacy: شهريًا وما دام التشفير متماثلًا (لا BACKUP_PUBLIC_KEY)، استعادة كاملة صارمة لآخر نسخة في قاعدة مؤقتة.
# التمرين الكامل بالمفتاح العام يجريه المالك شهريًا من جهازه (scripts/ops/restore-drill.sh)، لأن المفتاح الخاص
# لا يكون في GitHub. ويلزم تمرين ناجح قبل استقبال بيانات الدفعة.

on:
  schedule:
    - cron: '47 6 * * *'
    - cron: '17 3 2 * *'
  workflow_dispatch:

permissions:
  contents: read
  actions: read

jobs:
  r2:
    runs-on: ubuntu-latest
    env:
      R2_ACCOUNT_ID: ${{ secrets.R2_ACCOUNT_ID }}
      R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
      R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
      R2_BUCKET: ${{ secrets.R2_BUCKET }}
    steps:
      - name: Skip without R2
        id: gate
        run: |
          if [ -z "$R2_BUCKET" ]; then echo "::notice::R2 is not configured; nothing to check."; echo "skip=true" >> "$GITHUB_OUTPUT"; fi
      - uses: actions/checkout@v4
        if: steps.gate.outputs.skip != 'true'
      - uses: actions/setup-node@v7
        if: steps.gate.outputs.skip != 'true'
        with:
          node-version: '20'
      - name: The latest backup is fresh, complete and encrypted with the public key
        if: steps.gate.outputs.skip != 'true'
        run: node scripts/ops/backup-check.mjs --max-hours=36

  legacy:
    if: github.event_name == 'workflow_dispatch' || github.event.schedule == '17 3 2 * *'
    runs-on: ubuntu-latest
    env:
      DRILL_PASSPHRASE: ${{ secrets.BACKUP_PASSPHRASE }}
      PUBLIC_KEY: ${{ secrets.BACKUP_PUBLIC_KEY }}
      GH_TOKEN: ${{ github.token }}
      DRILL_DB_URL: postgresql://postgres:drill@localhost:5432/postgres
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_PASSWORD: drill
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12
    steps:
      - name: Skip unless the backups are still symmetric
        id: gate
        run: |
          if [ -n "$PUBLIC_KEY" ] || [ -z "$DRILL_PASSPHRASE" ]; then
            echo "::notice::Backups use the public key (or no passphrase is set); the full drill runs on the owner's machine (scripts/ops/restore-drill.sh)."
            echo "skip=true" >> "$GITHUB_OUTPUT"
          fi
      - uses: actions/checkout@v4
        if: steps.gate.outputs.skip != 'true'
      - uses: actions/setup-node@v7
        if: steps.gate.outputs.skip != 'true'
        with:
          node-version: '20'
      - name: Download the latest nightly backup
        if: steps.gate.outputs.skip != 'true'
        run: |
          run_id=$(gh run list --repo "$GITHUB_REPOSITORY" --workflow backup.yml --status success --limit 1 --json databaseId -q '.[0].databaseId')
          test -n "$run_id"
          gh run download "$run_id" --repo "$GITHUB_REPOSITORY" --dir dl
          dir=$(dirname "$(find dl -type f -name 'manifest-*.json' | head -1)")
          test -n "$dir"
          echo "DIR=$dir" >> "$GITHUB_ENV"
      - name: Strict restore and row counts against the manifest
        if: steps.gate.outputs.skip != 'true'
        run: bash scripts/ops/restore-drill.sh "$DIR"
