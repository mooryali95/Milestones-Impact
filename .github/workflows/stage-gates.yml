name: Stage gates report

# أسبوعيًا ويدويًا: تقرير بوابات المراحل الخمس إلى الاحترافية الكاملة
# (docs/audit/2026-11-09-خريطة-الطريق-إلى-الاحترافية-الكاملة-v1.md) في ملخص التشغيل.
# تقرير لا حارس: لا يفشل لأن مرحلة لم تُعبر، ويقرأ الإنتاج وGitHub قراءة فقط.

on:
  schedule:
    - cron: '23 5 * * 0'
  workflow_dispatch:

permissions:
  contents: read
  actions: read

jobs:
  report:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Skip without a token
        id: gate
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
        run: |
          if [ -z "$SUPABASE_ACCESS_TOKEN" ]; then
            echo "::notice::SUPABASE_ACCESS_TOKEN is not set; stage gates report skipped."
            echo "skip=true" >> "$GITHUB_OUTPUT"
          fi
      - uses: actions/checkout@v7
        if: steps.gate.outputs.skip != 'true'
        with:
          persist-credentials: false
      - uses: actions/setup-node@v7
        if: steps.gate.outputs.skip != 'true'
        with:
          node-version: '20'
      - name: Stage gates
        if: steps.gate.outputs.skip != 'true'
        # الرمزان لهذه الخطوة وحدها، لا لخطوات الإعداد قبلها
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          GITHUB_TOKEN: ${{ github.token }}
        run: node scripts/ops/stage-gates.mjs --md="$GITHUB_STEP_SUMMARY"
