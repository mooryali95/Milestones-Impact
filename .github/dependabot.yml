# تحديثات الاعتماديات أسبوعيًا بطلب دمج واحد لكل مجموعة (المرحلة ي). الكبرى (major) تبقى طلبات مستقلة
# ليُقرر المالك فيها: eslint 9+ وvitest 5+ وreact 19 تحتاج عملًا لا مجرد رفع رقم.
version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
      day: sunday
    open-pull-requests-limit: 5
    groups:
      minor-and-patch:
        update-types: [minor, patch]
    labels: [dependencies]
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: sunday
    labels: [dependencies]
