# تحديثات الاعتماديات شهريًا بطلب دمج واحد لكل منظومة (ترشيد 2026-11-11: كل طلب يشغّل CI).
# الإصدارات الكبرى (major) لا تُفتح لها طلبات تلقائية: eslint 9+ وreact 19 وغيرها تحتاج عملًا لا مجرد رفع رقم،
# فتُقرَّر وتُنفَّذ بطلب مقصود. تحديثات الأمان تبقى تصل فورًا (Dependabot security updates في إعدادات المستودع).
version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: monthly
    open-pull-requests-limit: 2
    groups:
      minor-and-patch:
        update-types: [minor, patch]
    ignore:
      - dependency-name: '*'
        update-types: ['version-update:semver-major']
    labels: [dependencies]
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
    groups:
      actions:
        patterns: ['*']
    labels: [dependencies]
